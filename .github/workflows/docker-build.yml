name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build backend
      run: |
        docker build -t a27959svalero/temperaturas-backend:latest ./backend

    - name: Push backend
      run: |
        docker push a27959svalero/temperaturas-backend:latest

    - name: Build frontend
      run: |
        docker build -t a27959svalero/temperaturas-frontend:latest ./frontend

    - name: Push frontend
      run: |
        docker push a27959svalero/temperaturas-frontend:latest
        