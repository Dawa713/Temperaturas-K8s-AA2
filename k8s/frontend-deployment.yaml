apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: temperaturas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: a27959svalero/temperaturas-frontend:v1
        ports:
        - containerPort: 3001
        env:
        - name: TEMP_SERVER
          value: backend-service:5000